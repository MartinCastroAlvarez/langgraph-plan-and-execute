<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
      .t { fill: #e2e8f0; font-size: 22px; }
      .s { fill: #94a3b8; font-size: 16px; }
      .m { fill: #34d399; font-size: 16px; font-family: "DejaVu Sans Mono", monospace; }
      .row { fill: #cbd5e1; font-size: 16px; font-family: "DejaVu Sans Mono", monospace; }
      .box { fill: #111a33; stroke: #34d399; stroke-width: 2; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 2; }
      .e { stroke: #34d399; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .ed { stroke: #34d399; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1280" height="640" fill="#0b1020"/>

  <text x="80" y="110" fill="#f8fafc" font-size="56" font-weight="700">langgraph-plan-and-execute</text>
  <text x="80" y="160" fill="#94a3b8" font-size="25">Plan first, then act: planner → executor → replanner, plus ReWOO and LLMCompiler.</text>

  <!-- planner -->
  <rect class="box" x="80" y="318" width="170" height="84" rx="14"/>
  <text class="t" x="165" y="354" text-anchor="middle">planner</text>
  <text class="s" x="165" y="380" text-anchor="middle">task → plan</text>
  <path class="e" d="M250 360 L 298 360"/>

  <!-- plan card -->
  <rect class="card" x="300" y="268" width="300" height="184" rx="14"/>
  <text x="320" y="298" fill="#64748b" font-size="15">Plan (Pydantic, validated DAG)</text>
  <text class="row" x="320" y="334">1 search_notes(kickoff)</text>
  <text class="row" x="320" y="364">2 date_math(<tspan fill="#34d399">#E1</tspan> + 45 d)</text>
  <text class="row" x="320" y="394">3 search_notes(distance)</text>
  <text class="row" x="320" y="424">4 convert_units(<tspan fill="#34d399">#E3</tspan> to mi)</text>

  <!-- interrupt pill -->
  <rect x="340" y="206" width="220" height="38" rx="19" fill="#0b1020" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="m" x="450" y="231" text-anchor="middle">interrupt(): approve?</text>
  <path d="M450 244 L 450 266" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>

  <path class="e" d="M600 360 L 658 360"/>

  <!-- executor -->
  <rect class="box" x="660" y="318" width="200" height="84" rx="14"/>
  <text class="t" x="760" y="354" text-anchor="middle">executor</text>
  <text class="s" x="760" y="380" text-anchor="middle">create_agent ⇄ tools</text>
  <path class="e" d="M860 360 L 918 360"/>

  <!-- replanner -->
  <rect class="box" x="920" y="318" width="190" height="84" rx="14"/>
  <text class="t" x="1015" y="354" text-anchor="middle">replanner</text>
  <text class="s" x="1015" y="380" text-anchor="middle">after every step</text>

  <!-- loop back -->
  <path class="ed" d="M1015 402 C 1015 480, 760 480, 760 404"/>
  <text class="m" x="888" y="500" text-anchor="middle">continue · insert · replace</text>

  <!-- answer -->
  <path class="e" d="M1110 360 L 1168 360"/>
  <text class="t" x="1176" y="368">answer</text>

  <!-- footer -->
  <text class="s" x="80" y="572">classic (replan per step)  ·  ReWOO (#E placeholders, 2 model calls)  ·  LLMCompiler-lite (parallel DAG waves)</text>
  <text class="s" x="80" y="600">budget: max steps · replans · tool calls  —  runs 100% locally on ollama</text>
</svg>
